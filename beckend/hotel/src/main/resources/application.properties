server.port=8080


# DB (Docker Postgres exposed as localhost:5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:booking_user}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver


# Flyway runs migrations first; Hibernate then validates the resulting schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# V0 creates the base schema, so a clean database migrates from scratch
# (V0 -> V5). baseline-on-migrate with baseline-version=0 handles legacy,
# pre-Flyway databases that already contain the base schema: they are
# baselined at 0 (V0 skipped) and only V1+ are applied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# With a from-scratch V0 baseline in place, checksum validation is back on.
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Static files (uploads/)
spring.web.resources.static-locations=file:uploads/

# JWT — no default on purpose: a missing/blank JWT_SECRET must fail fast at
# startup (see JwtSecretValidator). Never ship a default signing key.
jwt.secret=${JWT_SECRET:}

# First-admin bootstrap (see AdminBootstrapRunner). Disabled unless BOTH are set.
# Seeds a single ADMIN on a fresh DB, then remove ADMIN_BOOTSTRAP_PASSWORD from
# the environment after the first login. Never commit real values here.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
jwt.issuer=hotel-booking
jwt.audience=hotel-frontend
logging.level.org.springframework.security=WARN

# Optional image base (RoomTypeMapper)
image.base.url=${APP_IMAGE_BASE_URL:http://localhost:8080/roomtype/}

# Public server URL — used to build absolute upload/image URLs
app.server.url=${APP_SERVER_URL:http://localhost:8080}
app.frontend.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
server.address=0.0.0.0

# ── Stripe ──────────────────────────────────────────────────────────────────
# Use Stripe test keys from https://dashboard.stripe.com/test/apikeys
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_REPLACE_ME}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_REPLACE_ME}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_dev_dummy}

# ── Email (Spring Mail) ──────────────────────────────────────────────────────
# Gmail example: set MAIL_USER / MAIL_PASS env vars, or replace inline for dev
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sender display name
app.mail.from=${MAIL_FROM:noreply@luxstay.com}
app.mail.from-name=LuxStay Hotel

# Disable mail health check in dev (no SMTP configured)
management.health.mail.enabled=false
management.endpoint.health.show-details=always

# Claude / Anthropic API (optional)
ai.claude.api-key=${ANTHROPIC_API_KEY:}

# Google Gemini API (optional)
ai.gemini.api-key=${GEMINI_API_KEY:}

# Groq API (free tier — preferred AI backend)
ai.groq.api-key=${GROQ_API_KEY:}
