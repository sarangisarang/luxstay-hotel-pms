server.port=8080


# DB (Docker Postgres exposed as localhost:5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USER:booking_user}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=org.postgresql.Driver


# Flyway runs migrations first; Hibernate then validates the resulting schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4
# V1-V4 were applied before Flyway adoption; skip checksum validation for legacy.
# TODO: Once all environments have re-migrated cleanly from scratch (or checksums
#       are repaired via `flyway repair`), set this back to true.
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Static files (uploads/)
spring.web.resources.static-locations=file:uploads/

# JWT
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1kZXYtc2VjcmV0LWtleS1mb3ItbG9jYWwtdGVzdGluZy1vbmx5}
jwt.ttl-seconds=${JWT_TTL_SECONDS:86400}
jwt.issuer=hotel-booking
jwt.audience=hotel-frontend
logging.level.org.springframework.security=WARN

# Optional image base (RoomTypeMapper)
image.base.url=${APP_IMAGE_BASE_URL:http://localhost:8080/roomtype/}

# Public server URL — used to build absolute upload/image URLs
app.server.url=${APP_SERVER_URL:http://localhost:8080}
app.frontend.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
server.address=0.0.0.0

# ── Stripe ──────────────────────────────────────────────────────────────────
# Use Stripe test keys from https://dashboard.stripe.com/test/apikeys
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_REPLACE_ME}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_REPLACE_ME}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_dev_dummy}

# ── Email (Spring Mail) ──────────────────────────────────────────────────────
# Gmail example: set MAIL_USER / MAIL_PASS env vars, or replace inline for dev
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sender display name
app.mail.from=${MAIL_FROM:noreply@luxstay.com}
app.mail.from-name=LuxStay Hotel

# Disable mail health check in dev (no SMTP configured)
management.health.mail.enabled=false
management.endpoint.health.show-details=always

# Claude / Anthropic API (optional)
ai.claude.api-key=${ANTHROPIC_API_KEY:}

# Google Gemini API (optional)
ai.gemini.api-key=${GEMINI_API_KEY:}

# Groq API (free tier — preferred AI backend)
ai.groq.api-key=${GROQ_API_KEY:}
