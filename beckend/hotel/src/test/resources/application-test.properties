# ── Test profile — overrides production values ────────────────────────────────
# Uses H2 in-memory DB so no PostgreSQL is needed for context-load test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway in tests (schema created by Hibernate ddl-auto instead)
spring.flyway.enabled=false

# JWT — fixed test secret (base64 of 48-char string, meets 256-bit minimum)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktbm90LXByb2Q=
jwt.ttl-seconds=3600
jwt.issuer=hotel-booking
jwt.audience=hotel-frontend

# Stripe — dummy keys (no real calls in context test)
stripe.secret-key=sk_test_dummy
stripe.publishable-key=pk_test_dummy
stripe.webhook-secret=whsec_dummy

# Mail — disabled
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
management.health.mail.enabled=false

# AI — empty keys (falls back to rule-based)
ai.claude.api-key=
ai.gemini.api-key=

# Suppress noisy SQL in test output
spring.jpa.show-sql=false
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.flywaydb=ERROR
