name: CI/CD — LuxStay Hotel PMS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]


jobs:
  # ── 1. Backend: build + test ─────────────────────────────────────────────────
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: booking_user
          POSTGRES_PASSWORD: test1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking_user -d booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: beckend/hotel

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build & test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/booking_test
          DB_USER: booking_user
          DB_PASS: test1234
          JWT_SECRET: dGhpcy1pcy1hLXZlcnktbG9uZy1kZXYtc2VjcmV0LWtleQ==
          STRIPE_SECRET_KEY: sk_test_CIONLY
          STRIPE_PUBLISHABLE_KEY: pk_test_CIONLY
          MAIL_USER: ""
          MAIL_PASS: ""
        run: mvn -B verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: beckend/hotel/target/surefire-reports/

  # ── 2. Frontend: type-check + build ─────────────────────────────────────────
  frontend:
    name: Frontend (Node 20 / Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/HotelBooking

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/HotelBooking/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8080

  # ── 3. Notify Render deploy (auto-deploy handles the rest) ──────────────────
  notify:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: All checks passed
        run: echo "✅ CI passed — Render.com will auto-deploy from main branch"
