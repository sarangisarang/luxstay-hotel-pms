version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: luxstay_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-booking}
      POSTGRES_USER:     ${DB_USER:-booking_user}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booking_user} -d ${DB_NAME:-booking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./beckend/hotel
      dockerfile: Dockerfile
    container_name: luxstay_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL:                 jdbc:postgresql://db:5432/${DB_NAME:-booking}
      DB_USER:                ${DB_USER:-booking_user}
      DB_PASS:                ${DB_PASS:-changeme}
      JWT_SECRET:             ${JWT_SECRET}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      MAIL_HOST:              ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT:              ${MAIL_PORT:-587}
      MAIL_USER:              ${MAIL_USER}
      MAIL_PASS:              ${MAIL_PASS}
      MAIL_FROM:              ${MAIL_FROM:-noreply@luxstay.com}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/HotelBooking
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8080
    container_name: luxstay_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
